# Local Supabase CLI config. Generated for the outreach-platform project.
# Reference: https://supabase.com/docs/guides/local-development/cli/config

project_id = "outreach-platform"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
# Local mail catcher — magic links land here during development.
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Signup is open at the Supabase layer; the app-layer ADMIN_EMAIL allowlist
# is the actual gate (enforced in middleware + every route handler).
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[storage]
enabled = false

[realtime]
enabled = true
